<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" font-family="'Source Sans 3','Segoe UI',system-ui,sans-serif"><title>Small-World Web</title><desc>Agents form tight clusters (here Research, Build and Review) where everyone talks to everyone. A few bridge agents also belong to a second cluster and carry news across. Any agent can message its neighbours at any time, so an idea reaches everyone in two or three hops. The Weaver seeds the clusters, then mostly listens at the bridges.</desc><style>.ax-static{display:none}@media (prefers-reduced-motion: reduce){.ax-anim{display:none}.ax-static{display:inline}}</style><line x1="150" y1="84" x2="203.3" y2="122.7" stroke="#66aee8" stroke-width="1" stroke-linecap="round" opacity="0.35"/><line x1="150" y1="84" x2="182.9" y2="185.3" stroke="#66aee8" stroke-width="1" stroke-linecap="round" opacity="0.35"/><line x1="150" y1="84" x2="117.1" y2="185.3" stroke="#66aee8" stroke-width="1" stroke-linecap="round" opacity="0.35"/><line x1="150" y1="84" x2="96.7" y2="122.7" stroke="#66aee8" stroke-width="1" stroke-linecap="round" opacity="0.35"/><line x1="203.3" y1="122.7" x2="182.9" y2="185.3" stroke="#66aee8" stroke-width="1" stroke-linecap="round" opacity="0.35"/><line x1="203.3" y1="122.7" x2="117.1" y2="185.3" stroke="#66aee8" stroke-width="1" stroke-linecap="round" opacity="0.35"/><line x1="203.3" y1="122.7" x2="96.7" y2="122.7" stroke="#66aee8" stroke-width="1" stroke-linecap="round" opacity="0.35"/><line x1="182.9" y1="185.3" x2="117.1" y2="185.3" stroke="#66aee8" stroke-width="1" stroke-linecap="round" opacity="0.35"/><line x1="182.9" y1="185.3" x2="96.7" y2="122.7" stroke="#66aee8" stroke-width="1" stroke-linecap="round" opacity="0.35"/><line x1="117.1" y1="185.3" x2="96.7" y2="122.7" stroke="#66aee8" stroke-width="1" stroke-linecap="round" opacity="0.35"/><line x1="509.2" y1="82.4" x2="546" y2="137" stroke="#e8813a" stroke-width="1" stroke-linecap="round" opacity="0.35"/><line x1="509.2" y1="82.4" x2="505