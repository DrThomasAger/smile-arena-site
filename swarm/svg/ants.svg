<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" font-family="'Source Sans 3','Segoe UI',system-ui,sans-serif"><title>Pheromone Trails</title><desc>Ant stigmergy: agents never message each other. As each agent works it leaves marks (pheromone) in a shared field, such as &quot;this path worked&quot;, with a strength. Others follow stronger marks more often. Marks fade over time, so unused paths disappear and good paths grow stronger. This is how ant colony optimisation finds short routes.</desc><style>.ax-static{display:none}@media (prefers-reduced-motion: reduce){.ax-anim{display:none}.ax-static{display:inline}}</style><path d="M38 228 Q70 168 104 228 Z" fill="#2a1d10" stroke="#e8813a" stroke-width="1.5"/><text x="70" y="250" font-size="12" fill="#e8813a" text-anchor="middle">nest</text><g class="ax-anim"><path d="M92 200 C220 120 400 60 552 108" fill="none" stroke="#e2bb4f" stroke-linecap="round"><animate attributeName="stroke-width" values="1;7;7;1" keyTimes="0;.6;.9;1" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values=".15;.75;.75;.15" keyTimes="0;.6;.9;1" dur="12s" repeatCount="indefinite"/></path></g><g class="ax-static"><path d="M92 200 C220 120 400 60 552 108" fill="none" stroke="#e2bb4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"></path></g><g class="ax-anim"><path d="M92 222 C220 300 380 360 540 318" fill="none" stroke="#e2bb4f" stroke-linecap="round"><animate attributeName="stroke-width" values="5;1;1;5" keyTimes="0;.6;.9;1" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;.08;.08;.6" keyTimes="0;.6;.9;1" dur="12s" repeatCount="indefinite"/></path></g><g class="ax-static"><path d="M92 222 C220 300 380 360 540 318" fill="none" stroke="#e2bb4f" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.15"></path></g><path d="M92 210 L166.5 242.7 L217.5 257.5 L261.7 268.6 L337.7 263.5 L423 231.1 L502 259.9" fill="none" stroke="#