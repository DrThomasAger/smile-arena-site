.67</text><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.74;0.75;.97;1" dur="9s" repeatCount="indefinite"/></g></g><g class="ax-anim"><g opacity="0"><text x="396" y="204" font-size="11" fill="#57c49a" text-anchor="start" font-family="'JetBrains Mono',Consolas,monospace">n 7 w .71</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.74;0.75;.97;1" dur="9s" repeatCount="indefinite"/></g></g><g class="ax-static"><text x="396" y="204" font-size="11" fill="#57c49a" text-anchor="start" font-family="'JetBrains Mono',Consolas,monospace">n 7 w .71</text></g><text x="188" y="124" font-size="11" fill="#6c6558" text-anchor="start" font-family="'JetBrains Mono',Consolas,monospace">n 11</text><text x="488" y="124" font-size="11" fill="#6c6558" text-anchor="start" font-family="'JetBrains Mono',Consolas,monospace">n 7</text><text x="14" y="300" font-size="14" fill="#6c6558" text-anchor="start" font-weight="700">1 · select</text><g class="ax-anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.03;0.21;0.22;1" dur="9s" repeatCount="indefinite"/><text x="14" y="300" font-size="14" fill="#e2bb4f" text-anchor="start" font-weight="700">1 · select</text></g></g><text x="14" y="322" font-size="14" fill="#6c6558" text-anchor="start" font-weight="700">2 · expand</text><g class="ax-anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.35;0.36;1" dur="9s" repeatCount="indefinite"/><text x="14" y="322" font-size="14" fill="#b394ec" text-anchor="start" font-weight="700">2 · expand</text></g></g><text x="14" y="344" font-size="14" fill="#6c6558" text-anchor="start" font-weight="700">3 · roll out</text><g class="ax-anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38;0.39;0.63;0.64;1" dur="9s" repeatCount="indefinite"/><text x="14" y="344" font-size="14" fill="#e0584f" text-anchor="start" font-weight="700">3 · roll out</text></g></g><tex