<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" font-family="'Source Sans 3','Segoe UI',system-ui,sans-serif"><title>MCTS Grove</title><desc>Monte Carlo tree search as a team. A deterministic Selector walks the tree to the most promising leaf. An Expander proposes new moves there. Many cheap Rollout agents play each new move to the end. The result is backed up the path, updating visit counts and win rates. Over many cycles the best move emerges, and a short readable decision tree can be distilled from it, as in Dr. Ager's thesis.</desc><style>.ax-static{display:none}@media (prefers-reduced-motion: reduce){.ax-anim{display:none}.ax-static{display:inline}}</style><line x1="320" y1="48" x2="170" y2="128" stroke="#4a4237" stroke-width="1.5" stroke-linecap="round"/><line x1="320" y1="48" x2="320" y2="128" stroke="#4a4237" stroke-width="1.5" stroke-linecap="round"/><line x1="320" y1="48" x2="470" y2="128" stroke="#4a4237" stroke-width="1.5" stroke-linecap="round"/><line x1="170" y1="128" x2="120" y2="208" stroke="#4a4237" stroke-width="1.5" stroke-linecap="round"/><line x1="170" y1="128" x2="210" y2="208" stroke="#4a4237" stroke-width="1.5" stroke-linecap="round"/><line x1="320" y1="128" x2="270" y2="208" stroke="#4a4237" stroke-width="1.5" stroke-linecap="round"/><line x1="320" y1="128" x2="380" y2="208" stroke="#4a4237" stroke-width="1.5" stroke-linecap="round"/><line x1="470" y1="128" x2="510" y2="208" stroke="#4a4237" stroke-width="1.5" stroke-linecap="round"/><line x1="120" y1="208" x2="95" y2="268" stroke="#3a342b" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 5"/><line x1="120" y1="208" x2="140" y2="268" stroke="#3a342b" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 5"/><line x1="510" y1="208" x2="540" y2="268" stroke="#3a342b" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 5"/><line x1="270" y1="208" x2="260" y2="268" stroke="#3a342b" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 5"/><