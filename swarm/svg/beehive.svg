<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" font-family="'Source Sans 3','Segoe UI',system-ui,sans-serif"><title>Waggle Dance Hive</title><desc>Modelled on honeybee foraging and house-hunting. Scouts fly out to explore options and come back to dance: the waggle run points to the option and its vigour shows the quality. Recruits follow the strongest dances and check for themselves, so good options gain followers fast. When enough bees agree (a quorum), the hive commits. The queen's scent keeps the hive one.</desc><style>.ax-static{display:none}@media (prefers-reduced-motion: reduce){.ax-anim{display:none}.ax-static{display:inline}}</style><path d="M216 180L216 210L190 225L164 210L164 180L190 165Z" fill="#261f10" stroke="#e2bb4f" stroke-width="1.4" opacity=".9"/><path d="M262.8 207L262.8 237L236.8 252L210.8 237L210.8 207L236.8 192Z" fill="#261f10" stroke="#e2bb4f" stroke-width="1.4" opacity=".9"/><path d="M216 234L216 264L190 279L164 264L164 234L190 219Z" fill="#261f10" stroke="#e2bb4f" stroke-width="1.4" opacity=".9"/><path d="M169.2 207L169.2 237L143.2 252L117.2 237L117.2 207L143.2 192Z" fill="#261f10" stroke="#e2bb4f" stroke-width="1.4" opacity=".9"/><path d="M169.2 153L169.2 183L143.2 198L117.2 183L117.2 153L143.2 138Z" fill="#261f10" stroke="#e2bb4f" stroke-width="1.4" opacity=".9"/><path d="M216 126L216 156L190 171L164 156L164 126L190 111Z" fill="#261f10" stroke="#e2bb4f" stroke-width="1.4" opacity=".9"/><path d="M262.8 153L262.8 183L236.8 198L210.8 183L210.8 153L236.8 138Z" fill="#261f10" stroke="#e2bb4f" stroke-width="1.4" opacity=".9"/><circle cx="237.1" cy="222.8" r="2.4" fill="#a2998a"/><circle cx="239.6" cy="224.3" r="2.4" fill="#a2998a"/><circle cx="199.1" cy="250" r="2.4" fill="#a2998a"/><circle cx="179.1" cy="249.8" r="2.4" fill="#a2998a"/><circle cx="146" cy="220.7" r="2.4" fill="#a2998a"/><circle cx="142.7" cy="230.9" r="2.4" fill="#a2998a"/><circle cx="141.1" cy="172.4" r="2.4" fill="#a2998a"/><circle cx="147.9" cy="159.2