<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" font-family="'Source Sans 3','Segoe UI',system-ui,sans-serif"><title>Quaker Silence</title><desc>Modelled on a Quaker meeting for business. Agents sit in shared silence. An agent speaks only when it is moved (it has something new and important), speaks once per matter, and everyone listens. The Clerk does not vote or argue: it discerns the &quot;sense of the meeting&quot; and writes a minute that everyone can unite with.</desc><style>.ax-static{display:none}@media (prefers-reduced-motion: reduce){.ax-anim{display:none}.ax-static{display:inline}}</style><circle cx="320" cy="190" r="135" fill="none" stroke="#3a342b" stroke-width="1" stroke-dasharray="2 6"/><text x="320" y="184" font-size="18" fill="#6c6558" text-anchor="middle" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-style="italic">silence</text><g class="ax-anim"><circle cx="448.4" cy="231.7" r="16" fill="none" stroke="#e8813a" stroke-width="2" opacity="0"><animate attributeName="r" values="16;16;150;150" keyTimes="0;0.1;0.26;1" dur="15s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;.9;0;0" keyTimes="0;0.1;0.18;0.26;1" dur="15s" repeatCount="indefinite"/></circle></g><g class="ax-anim"><circle cx="448.4" cy="231.7" r="20" fill="#e8813a" opacity="0"><animate attributeName="opacity" values="0;0;0.5;0;0" keyTimes="0;0.08;0.17;0.26;1" dur="15s" repeatCount="indefinite"/></circle></g><g class="ax-anim"><circle cx="191.6" cy="231.7" r="16" fill="none" stroke="#e8813a" stroke-width="2" opacity="0"><animate attributeName="r" values="16;16;150;150" keyTimes="0;0.34;0.5;1" dur="15s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;.9;0;0" keyTimes="0;0.34;0.42;0.5;1" dur="15s" repeatCount="indefinite"/></circle></g><g class="ax-anim"><circle cx="191.6" cy="231.7" r="20" fill="#e8813a" opacity="0"><animate attributeName="opacity" values="0;0;0.5;0;0" keyTimes="0;0.32;0.41;0.5;1" dur="15s" repeatCount="indefinite"/></circle></g><g class="ax-anim"><circle cx="320" cy="325" r="16" fill="none" stroke="#e8813a" stroke-width="2" opacity="0"><animate attributeName="r" values="16;16;150;150" keyTimes="0;0.5800000000000001;0.72;1" dur="15s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;.9;0;0" keyTimes="0;0.5800000000000001;0.65;0.72;1" dur="15s" repeatCount="indefinite"/></circle></g><g class="ax-anim"><circle cx="320" cy="325" r="20" fill="#e8813a" opacity="0"><animate attributeName="opacity" values="0;0;0.5;0;0" keyTimes="0;0.56;0.64;0.72;1" dur="15s" repeatCount="indefinite"/></circle></g><g class="ax-anim"><circle cx="320" cy="55" r="18" fill="none" stroke="#e2bb4f" stroke-width="3" opacity="0"><animate attributeName="r" values="18;18;70;70" keyTimes="0;0.78;0.92;1" dur="15s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;.9;0;0" keyTimes="0;0.78;0.85;0.92;1" dur="15s" repeatCount="indefinite"/></circle></g><circle cx="320" cy="55" r="19" fill="#261f10" stroke="#e2bb4f" stroke-width="2"/><text x="320" y="55" dy=".36em" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-weight="700" font-size="11" fill="#e2bb4f">CL</text><circle cx="399.4" cy="80.8" r="15" fill="#211e19" stroke="#a2998a" stroke-width="2"/><circle cx="448.4" cy="148.3" r="15" fill="#211e19" stroke="#a2998a" stroke-width="2"/><circle cx="448.4" cy="231.7" r="15" fill="#211e19" stroke="#a2998a" stroke-width="2"/><circle cx="399.4" cy="299.2" r="15" fill="#211e19" stroke="#a2998a" stroke-width="2"/><circle cx="320" cy="325" r="15" fill="#211e19" stroke="#a2998a" stroke-width="2"/><circle cx="240.6" cy="299.2" r="15" fill="#211e19" stroke="#a2998a" stroke-width="2"/><circle cx="191.6" cy="231.7" r="15" fill="#211e19" stroke="#a2998a" stroke-width="2"/><circle cx="191.6" cy="148.3" r="15" fill="#211e19" stroke="#a2998a" stroke-width="2"/><circle cx="240.6" cy="80.8" r="15" fill="#211e19" stroke="#a2998a" stroke-width=