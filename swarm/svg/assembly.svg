<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" font-family="'Source Sans 3','Segoe UI',system-ui,sans-serif"><title>Assembly Line</title><desc>Work moves along a fixed line of stations: Intake, Draft, Refine, Check, Ship. Each station receives only from the station before it and hands only to the station after it. The Check station may send an item back to Refine. The Line Lead sets the cadence and watches for pile-ups.</desc><style>.ax-static{display:none}@media (prefers-reduced-motion: reduce){.ax-anim{display:none}.ax-static{display:inline}}</style><line x1="30" y1="210" x2="610" y2="210" stroke="#211e19" stroke-width="10" stroke-linecap="round"/><line x1="30" y1="210" x2="610" y2="210" stroke="#4a4237" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 8"/><line x1="320" y1="70" x2="70" y2="184" stroke="#6c6558" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 5"/><line x1="320" y1="70" x2="195" y2="184" stroke="#6c6558" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 5"/><line x1="320" y1="70" x2="320" y2="184" stroke="#6c6558" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 5"/><line x1="320" y1="70" x2="445" y2="184" stroke="#6c6558" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 5"/><line x1="320" y1="70" x2="570" y2="184" stroke="#6c6558" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 5"/><path d="M445 238 Q382 300 320 238" fill="none" stroke="#e0584f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"></path><text x="382" y="296" font-size="12" fill="#e0584f" text-anchor="middle">send back</text><g class="ax-anim"><rect x="-7" y="-7" width="14" height="14" rx="3" stroke="#0c0b0a" stroke-width="1.5"><animateMotion path="M30 210 L610 210" dur="10s" begin="0s" repeatCount="indefinite"/><animate attributeName="fill" values="#e8813a;#e2bb4f;#66aee8;#b394ec;#57c49a" keyTimes="0;.29;.5;.72;.93" calcMode="discrete" dur="10s" begin="