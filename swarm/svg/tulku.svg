"352" y="66" font-size="13" fill="#e2bb4f" text-anchor="start" font-weight="700">Lineage holder</text><text x="352" y="82" font-size="12" fill="#a2998a" text-anchor="start">tests and recognises each new birth</text><rect x="270" y="316" width="100" height="34" rx="6" fill="#12201a" stroke="#57c49a"/><text x="320" y="338" font-size="12" fill="#57c49a" text-anchor="middle" font-weight="700">lineage record</text><text x="14" y="386" font-size="12" fill="#a2998a" text-anchor="start">each life writes its record · the record (gold) crosses the bardo · the next is born knowing</text></svg>