<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" font-family="'Source Sans 3','Segoe UI',system-ui,sans-serif"><title>Tulku Lineage</title><desc>Following note 9: every role has a lifecycle like a tulku line. Each instance (a context window, a session) lives one life and writes its record before it ends. The record crosses the bardo (the transition, where it is compressed) to the next instance. The Lineage Holder tests each new birth to confirm it recognises the record. One instance lives at a time, with continuity across all of them.</desc><style>.ax-static{display:none}@media (prefers-reduced-motion: reduce){.ax-anim{display:none}.ax-static{display:inline}}</style><line x1="36" y1="232" x2="620" y2="232" stroke="#4a4237" stroke-width="2" stroke-linecap="round"/><line x1="320" y1="70" x2="50" y2="218" stroke="#66aee8" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 5" opacity="0.5"/><rect x="50" y="224" width="115" height="16" rx="5" fill="#211e19" stroke="#e8813a" stroke-width="1.2"/><g class="ax-anim"><rect x="50" y="224" width="115" height="16" rx="5" fill="#e8813a" opacity="0"><animate attributeName="opacity" values="0;0;.75;.75;0;0" keyTimes="0;0.0172;0.027200000000000002;0.2055;0.2155;1" dur="16s" repeatCount="indefinite"/></rect></g><circle cx="50" cy="232" r="13" fill="#261f10" stroke="#e2bb4f" stroke-width="2"/><text x="50" y="232" dy=".36em" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-weight="700" font-size="10" fill="#e2bb4f">I</text><text x="113.5" y="262" font-size="12" fill="#a2998a" text-anchor="middle">life 1</text><g class="ax-anim"><circle r="5" fill="#66aee8" opacity="0"><animateMotion path="M320 70 L50 218" dur="16s" keyPoints="0;0;1;1" keyTimes="0;0.001;0.0172;1" calcMode="linear" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.001;0.005;0.0132;0.0172;1" dur="16s" repeatCount="indefinite"/></circle></g><path d="M165 222 Q182.5 152 2