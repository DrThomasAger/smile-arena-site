<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" font-family="'Source Sans 3','Segoe UI',system-ui,sans-serif"><title>Great Law Council</title><desc>Modelled on the Haudenosaunee (Iroquois) Grand Council under the Great Law of Peace. Each nation first reaches one mind in its own council. The Elder Brothers (Mohawk, Seneca) consider a matter and pass it across the fire to the Younger Brothers (Oneida, Cayuga; the Tuscarora joined later). It comes back, and the Firekeepers (Onondaga) confirm it or return it. Clan mothers choose the chiefs and can remove them, and decisions weigh the seventh generation.</desc><style>.ax-static{display:none}@media (prefers-reduced-motion: reduce){.ax-anim{display:none}.ax-static{display:inline}}</style><line x1="50" y1="140" x2="110" y2="140" stroke="#e0584f" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/><line x1="50" y1="262" x2="110" y2="262" stroke="#e0584f" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/><line x1="590" y1="140" x2="530" y2="140" stroke="#e0584f" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/><line x1="590" y1="262" x2="530" y2="262" stroke="#e0584f" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/><line x1="140" y1="160" x2="140" y2="242" stroke="#4a4237" stroke-width="1.2" stroke-linecap="round"/><line x1="500" y1="160" x2="500" y2="242" stroke="#4a4237" stroke-width="1.2" stroke-linecap="round"/><path d="M170 200 Q320 140 470 200" fill="none" stroke="#4a4237" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"></path><path d="M470 214 Q320 274 170 214" fill="none" stroke="#4a4237" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"></path><path d="M160 120 Q220 70 292 72" fill="none" stroke="#4a4237" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"></path><g class="ax-anim"><circle r="5" fill="#e8813a" opa