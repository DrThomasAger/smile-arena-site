<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" font-family="'Source Sans 3','Segoe UI',system-ui,sans-serif"><title>Gravitational Orbit</title><desc>One orchestrator sits at the centre with the whole context. It spawns background agents, each carrying a self-contained sub-prompt. Each agent leaves, works on its own (its orbit), and comes back exactly once with a result. Agents talk only to the centre, never to each other. The centre keeps working while they are out and folds each result in as it lands. This is how the current Claude session runs its background agents.</desc><style>.ax-static{display:none}@media (prefers-reduced-motion: reduce){.ax-anim{display:none}.ax-static{display:inline}}</style><circle cx="320" cy="200" r="92" fill="none" stroke="#6c6558" stroke-width="1.2" stroke-dasharray="3 6" opacity=".7"/><circle cx="320" cy="200" r="136" fill="none" stroke="#6c6558" stroke-width="1.2" stroke-dasharray="3 6" opacity=".7"/><circle cx="320" cy="200" r="178" fill="none" stroke="#6c6558" stroke-width="1.2" stroke-dasharray="3 6" opacity=".7"/><g class="ax-anim"><circle cx="320" cy="200" r="44" fill="none" stroke="#e8813a" stroke-width="3" opacity="0"><animate attributeName="r" values="44;76;76" keyTimes="0;.14;1" dur="9s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0;0" keyTimes="0;.14;1" dur="9s" begin="0s" repeatCount="indefinite"/></circle></g><g class="ax-anim"><circle cx="320" cy="200" r="76" fill="none" stroke="#57c49a" stroke-width="3" opacity="0"><animate attributeName="r" values="76;76;46;46" keyTimes="0;.86;.995;1" dur="9s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;.95;0" keyTimes="0;.86;.995;1" dur="9s" begin="0s" repeatCount="indefinite"/></circle></g><g class="ax-anim"><circle cx="320" cy="200" r="44" fill="none" stroke="#e8813a" stroke-width="3" opacity="0"><animate attributeName="r" values="44;76;76" keyTimes="0;.14;1" dur="9s" begin="-3s" repe